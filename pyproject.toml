[project]
name = "my-ml-project"
version = "0.1.0"
description = "End-to-end ML project: scraping -> storage -> modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "PyYAML",
  "requests-oauthlib",
  "open-clip-torch",
  "supabase",
  "pydantic",
  "python-dotenv",
  "tqdm",
  "pandas",
  "pyarrow",
  "torch",
  "scikit-learn",
  "tensorboard",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
ml_extra = ["torchmetrics", "lightning"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
